<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>VELI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --gold:#F5B642; --gold-hi:#FFD98A; --amber:#C9781A;
  --text:#F3E9D6; --muted:#9C8B6E; --line:rgba(245,182,66,.28); --field:#0d0905;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000000; --text:#F3E9D6; } }
:root[data-theme="dark"]{ --bg:#000000; --text:#F3E9D6; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;overflow:hidden;
}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:0 18px}
.top{display:flex;justify-content:flex-end;padding-top:10px;min-height:52px}
.icon-btn{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;
  color:var(--gold);display:grid;place-items:center;cursor:pointer;
}
.icon-btn:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.orb-wrap{position:relative;width:min(88vw,46vh,440px);aspect-ratio:1}
canvas{width:100%;height:100%;display:block;cursor:pointer}
.name{
  font-family:"Michroma","Eurostile","Bank Gothic",system-ui,sans-serif;
  font-size:clamp(28px,7vw,40px);letter-spacing:.42em;margin:4px 0 0 .42em;
  color:var(--gold-hi);text-shadow:0 0 18px rgba(245,182,66,.55);
}
.status{font-size:15px;color:var(--muted);min-height:22px;text-align:center}
.status.live{color:var(--gold)}
.heard{font-size:13px;color:var(--muted);opacity:.75;min-height:18px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.talk{width:100%;max-height:26vh;overflow-y:auto;padding:4px 2px 10px;font-size:16px;line-height:1.55}
.you{color:var(--muted);margin:0 0 6px}
.her{color:var(--text);margin:0;white-space:pre-wrap}
.bar{display:flex;gap:10px;align-items:center;padding:10px 0 14px}
.mic{
  flex:0 0 auto;width:56px;height:56px;border-radius:50%;cursor:pointer;
  border:1px solid var(--gold);background:radial-gradient(circle at 50% 40%,#3a2408,#120a02);
  color:var(--gold-hi);display:grid;place-items:center;
}
.mic.on{background:radial-gradient(circle at 50% 40%,#F5B642,#9a5a10);color:#1a0f02;box-shadow:0 0 22px rgba(245,182,66,.6)}
.field{flex:1;display:flex;align-items:center;border:1px solid var(--line);border-radius:28px;background:var(--field);padding:0 6px 0 18px;height:56px}
.field input{flex:1;min-width:0;background:transparent;border:0;color:var(--text);font:inherit;font-size:16px;outline:none}
.field input::placeholder{color:var(--muted)}
.send{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--gold);cursor:pointer;display:grid;place-items:center}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.open{display:flex}
.panel{
  width:100%;max-width:560px;background:#0c0804;border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto;
}
.panel h2{font-family:"Michroma",system-ui,sans-serif;font-size:16px;letter-spacing:.12em;color:var(--gold-hi);margin:0 0 14px;font-weight:400}
.panel label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
.panel textarea{width:100%;min-height:130px;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:15px;line-height:1.5;resize:vertical}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:15px}
.panel .actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{border-radius:24px;padding:12px 20px;font:inherit;font-size:15px;cursor:pointer;border:1px solid var(--gold);background:transparent;color:var(--gold-hi)}
.btn.primary{background:var(--gold);color:#1a0f02;font-weight:600}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin-top:16px}
@media (prefers-reduced-motion: reduce){ .mic.on{box-shadow:none} }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="icon-btn" id="openSettings" aria-label="Ajustes da VELI">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <div class="stage">
    <div class="orb-wrap"><canvas id="orb" aria-label="VELI. Toque para ativar ou interromper"></canvas></div>
    <div class="name">VELI</div>
    <div class="status" id="status" aria-live="polite">Toque no microfone para ativar</div>
    <div class="heard" id="heard"></div>
    <div class="talk" id="talk"></div>
  </div>

  <div class="bar">
    <button class="mic" id="mic" aria-label="Ativar escuta">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <form class="field" id="form" onsubmit="return false">
      <input id="text" type="text" placeholder="Escreva para a VELI" autocomplete="off" enterkeyhint="send" aria-label="Mensagem para a VELI">
      <button class="send" id="send" type="button" aria-label="Enviar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="panel">
    <h2 id="sheetTitle">Ajustes da VELI</h2>
    <label for="pw">Senha da VELI</label>
    <input id="pw" type="password" autocomplete="current-password" style="width:100%;height:48px;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;font-size:16px">
    <label for="natSel">Voz natural</label>
    <select id="natSel" style="width:100%;height:48px;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:0 12px;font:inherit;font-size:15px"><option value="Aoede">Aoede (feminina, leve)</option><option value="Kore">Kore (feminina, firme)</option><option value="Leda">Leda (feminina, jovem)</option><option value="Zephyr">Zephyr (feminina, animada)</option><option value="Sulafat">Sulafat (feminina, calorosa)</option><option value="Despina">Despina (feminina, suave)</option><option value="Callirrhoe">Callirrhoe (feminina, tranquila)</option><option value="Puck">Puck (masculina, animada)</option><option value="Charon">Charon (masculina, serena)</option><option value="Fenrir">Fenrir (masculina, empolgada)</option><option value="Orus">Orus (masculina, firme)</option><option value="Achird">Achird (masculina, amigável)</option><option value="Sadaltager">Sadaltager (masculina, experiente)</option><option value="">Desligada: usar só a voz do navegador</option></select>
    <div class="actions" style="margin-top:12px"><button class="btn" id="testNat" type="button">Ouvir voz natural</button></div>
    <label for="voiceSel">Voz reserva do navegador</label>
    <select id="voiceSel" style="width:100%;height:48px;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:0 12px;font:inherit;font-size:15px"></select>
    <label for="rate">Velocidade</label>
    <input id="rate" type="range" min="0.7" max="1.4" step="0.05" style="width:100%;accent-color:#F5B642">
    <label for="pitch">Tom</label>
    <input id="pitch" type="range" min="0.6" max="1.5" step="0.05" style="width:100%;accent-color:#F5B642">
    <div class="actions" style="margin-top:12px"><button class="btn" id="testVoice" type="button">Ouvir voz reserva</button></div>
    <div class="row"><span>Responder em voz alta</span><input type="checkbox" id="voiceOn" checked style="width:22px;height:22px;accent-color:#F5B642"></div>
    <div class="actions">
      <button class="btn primary" id="saveSettings">Salvar ajustes</button>
      <button class="btn" id="clearHistory">Limpar tela</button>
      <button class="btn" id="closeSettings">Fechar</button>
    </div>
    <p class="note">Com a escuta ativa e esta tela aberta, diga "Veli" e depois o seu pedido. A senha fica guardada só neste aparelho. As memórias da VELI ficam na sua planilha VELI Memória, iguais no computador e no celular.</p>
  </div>
</div>

function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

const $ = id => document.getElementById(id);
const statusEl = $("status"), talkEl = $("talk"), micBtn = $("mic"), input = $("text");
function setStatus(t, live){ statusEl.textContent = t; statusEl.classList.toggle("live", !!live); }
function showTalk(you, her){
  talkEl.innerHTML = "";
  if (you){ const p = document.createElement("p"); p.className = "you"; p.textContent = you; talkEl.appendChild(p); }

  return h;
}

/* ---------- animação da esfera ---------- */
const canvas = $("orb"), ctx = canvas.getContext("2d");
const ball = new Image(); ball.src = BALL_SRC;
const N = 132, base = [], val = [];
for (let i = 0; i < N; i++){
  let r = Math.random();
  base.push(0.35 + 0.65 * Math.pow(r, 2.6) + (i % 11 === 0 ? 0.3 : 0));
  val.push(0.2);
}
for (let k = 0; k < 2; k++) for (let i = 0; i < N; i++) base[i] = (base[i] + base[(i+1)%N] * 0.5 + base[(i-1+N)%N] * 0.5) / 2;
let state = "off"; // off | idle | listening | thinking | speaking
let energy = 0, spikes = new Array(N).fill(0), lastSpike = 0;
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = canvas.getBoundingClientRect().width;
  canvas.width = Math.round(s * dpr); canvas.height = Math.round(s * dpr);
}
window.addEventListener("resize", resize); resize();

function frame(t){
  t /= 1000;
  const W = canvas.width, C = W / 2, R = W * 0.29;
  ctx.clearRect(0, 0, W, W);
  energy *= 0.94;
  if (state === "speaking" && t - lastSpike > 0.09){
    lastSpike = t;
    for (let i = 0; i < N; i++) spikes[i] = Math.random() * (0.55 + energy * 0.6);
  }
  for (let i = 0; i < N; i++){
    const a = i / N * Math.PI * 2;
    let target;
    if (state === "off") target = 0.32 + 0.04 * Math.sin(t * 0.8 + i * 0.2);
    else if (state === "idle") target = 0.55 + 0.12 * Math.sin(t * 1.4 + i * 0.35);
    else if (state === "listening") target = 0.75 + 0.18 * Math.sin(t * 5 + i * 0.9) + Math.random() * 0.1;
    else if (state === "thinking"){ const d = Math.cos(a - t * 3.2); target = 0.4 + 0.9 * Math.pow(Math.max(0, d), 6); }
    else target = 0.45 + spikes[i] + 0.25 * Math.max(0, Math.sin(a * 3 + t * 6));
    if (reduce) target = 0.55;
    val[i] += (target - val[i]) * (state === "speaking" ? 0.35 : 0.12);
  }
  const glow = { off: .25, idle: .45, listening: .75, thinking: .6, speaking: .7 + energy * .3 }[state];
  const g = ctx.createRadialGradient(C, C, R * 0.8, C, C, R * 1.75);
  g.addColorStop(0, `rgba(245,170,50,${0.32 * glow})`); g.addColorStop(1, "rgba(245,170,50,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, W);

  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
  const r0 = R * 1.06, maxL = R * 0.62, lw = Math.max(1.5, W * 0.0058);
  const pass = (width, color) => {
    ctx.beginPath();
    for (let i = 0; i < N; i++){
      const a = i / N * Math.PI * 2 - Math.PI / 2, L = maxL * Math.min(1.25, base[i] * val[i]);
      const c = Math.cos(a), s = Math.sin(a);
      ctx.moveTo(C + c * r0, C + s * r0); ctx.lineTo(C + c * (r0 + L), C + s * (r0 + L));
    }
    ctx.lineWidth = width; ctx.strokeStyle = color; ctx.stroke();
  };
  pass(lw * 4, `rgba(255,150,30,${0.10 + 0.12 * glow})`);
  pass(lw * 2, `rgba(255,185,70,${0.25 + 0.2 * glow})`);
  pass(lw * 0.9, "rgba(255,228,160,0.95)");
  ctx.restore();

  if (ball.complete && ball.naturalWidth){
    const breathe = reduce ? 1 : 1 + 0.008 * Math.sin(t * 1.3) + energy * 0.012;
    const D = R * 2 * breathe;
    ctx.save(); ctx.beginPath(); ctx.arc(C, C, D / 2, 0, Math.PI * 2); ctx.clip();
    ctx.globalAlpha = state === "off" ? 0.8 : 1;
    ctx.drawImage(ball, C - D / 2, C - D / 2, D, D); ctx.restore();
    ctx.beginPath(); ctx.arc(C, C, D / 2, 0, Math.PI * 2);
    ctx.lineWidth = lw * 0.8; ctx.strokeStyle = `rgba(255,210,120,${0.35 + 0.4 * glow})`; ctx.stroke();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- cérebro (planilha + Gemini) ---------- */
const BRAIN_URL = "https://script.google.com/macros/s/AKfycbzB69qEVz6xl2aYatlsuEVh4ibd5mBng13HiHfJPLq4p6_nwJOsGpwf45UDDQcAlIP75A/exec";
const ERROS = {
  senha: "Senha incorreta. Confira a senha nos ajustes, no ícone de engrenagem.",
  limite: "Atingi o limite gratuito do Gemini por agora. Tente de novo daqui a pouco.",
  chave: "A chave do Gemini não foi aceita. Confira a chave na linha 6 do código.",
  vazio: "Não entendi a mensagem. Pode repetir?"
};
let busy = false;
async function ask(text){
  text = (text || "").trim();
  if (!text || busy) return;
  if (!settings.senha){ openSettings(); setStatus("Digite a senha da VELI para começar"); return; }
  busy = true; state = "thinking"; setStatus("Pensando...", true);
  pauseListening();
  const herEl = showTalk(text, "");
  let answer = "";
  try{
    const res = await fetch(BRAIN_URL, { method: "POST", redirect: "follow", body: JSON.stringify({ acao: "conversar", senha: settings.senha, mensagem: text }) });
    const data = await res.json();
    if (data.erro) answer = ERROS[data.erro] || "Não consegui responder agora. Tente de novo.";
    else answer = (data.resposta || "").trim();
  }catch(e){
    answer = navigator.onLine === false ? "Estou sem internet agora." : "Não consegui falar com a minha memória. Tente de novo.";
  }
  herEl.textContent = answer;
  history.push({ role: "user", content: text }, { role: "assistant", content: answer });
  history = history.slice(-10); save("veli-history", history);
  busy = false;
  speak(answer);
}

/* ---------- voz (fala) ---------- */
let voice = null, allVoices = [];
function rankVoice(v){
  let s = 0;
  if (/pt[-_]BR/i.test(v.lang)) s += 50;
  if (/natural|neural|online/i.test(v.name)) s += 30;
  if (/google/i.test(v.name)) s += 15;
  if (/francisca|thalita|maria|luciana|feminin|female/i.test(v.name)) s += 5;
  return s;
}
function pickVoice(){
  try{
    allVoices = speechSynthesis.getVoices().filter(v => /^pt/i.test(v.lang)).sort((a, b) => rankVoice(b) - rankVoice(a));
    voice = allVoices.find(v => v.name === settings.voiceName) || allVoices[0] || null;
    fillVoices();
  }catch(e){}
}
function fillVoices(){
  const sel = $("voiceSel"); if (!sel) return;
  sel.innerHTML = "";
  if (!allVoices.length){ const o = document.createElement("option"); o.textContent = "Voz padrão do aparelho"; o.value = ""; sel.appendChild(o); return; }
  allVoices.forEach(v => { const o = document.createElement("option"); o.value = v.name; o.textContent = v.name.replace(/^Microsoft\s+/i, "") + (/pt[-_]PT/i.test(v.lang) ? " (Portugal)" : ""); sel.appendChild(o); });
  sel.value = voice ? voice.name : allVoices[0].name;
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function clean(t){ return t.replace(/[*_#`>]/g, "").replace(/\s+—\s+/g, ", ").replace(/https?:\/\/\S+/g, "o link"); }
let audioCtx = null, analyser = null, levelData = null, currentSrc = null;
function unlockAudio(){
  try{
    if (!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 512;
      levelData = new Uint8Array(analyser.fftSize);
      analyser.connect(audioCtx.destination);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
  }catch(e){}
}
document.addEventListener("click", unlockAudio, true);
document.addEventListener("keydown", unlockAudio, true);
function audioLevel(){
  if (!analyser || !currentSrc) return 0;
  analyser.getByteTimeDomainData(levelData);
  let s = 0; for (let i = 0; i < levelData.length; i++){ const v = (levelData[i] - 128) / 128; s += v * v; }
  return Math.min(1, Math.sqrt(s / levelData.length) * 4);
}
(function pump(){ const l = audioLevel(); if (l > energy) energy = l; requestAnimationFrame(pump); })();

function b64ToBytes(b64){ const bin = atob(b64); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
async function toBuffer(b64, mime){
  const bytes = b64ToBytes(b64);
  if (/L16|pcm/i.test(mime) || !mime){
    const rate = parseInt((mime.match(/rate=(\d+)/) || [0, 24000])[1], 10);
    const samples = new Int16Array(bytes.buffer, 0, Math.floor(bytes.length / 2));
    const buf = audioCtx.createBuffer(1, samples.length, rate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < samples.length; i++) ch[i] = samples[i] / 32768;
    return buf;
  }
  return await audioCtx.decodeAudioData(bytes.buffer);
}
function playBuffer(buf){
  return new Promise(resolve => {
    try{ if (currentSrc) currentSrc.stop(); }catch(e){}
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.connect(analyser);
    src.onended = () => { if (currentSrc === src) currentSrc = null; resolve(); };
    currentSrc = src; src.start();
  });
}
function stopSpeaking(){
  try{ speechSynthesis.cancel(); }catch(e){}
  try{ if (currentSrc){ const s = currentSrc; currentSrc = null; s.stop(); } }catch(e){}
}
async function naturalAudio(text, voz){
  const res = await fetch(BRAIN_URL, { method: "POST", redirect: "follow", body: JSON.stringify({ acao: "falar", senha: settings.senha, texto: text, voz: voz }) });
  const data = await res.json();
  if (data.erro || !data.audio) throw new Error(data.erro || "sem audio");
  unlockAudio();
  return await toBuffer(data.audio, data.mime || "");
}

function browserSpeak(text, done){
  if (!("speechSynthesis" in window)){ done(); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean(text));
    u.lang = voice ? voice.lang : "pt-BR"; if (voice) u.voice = voice; u.rate = settings.rate || 1.03; u.pitch = settings.pitch || 1;
    u.onstart = () => { state = "speaking"; setStatus("Falando... toque na esfera para interromper", true); };
    u.onboundary = () => { energy = 1; };
    u.onend = done; u.onerror = done;
    state = "speaking";
    speechSynthesis.speak(u);
  }catch(e){ done(); }
}

async function speak(text){
  let finished = false;
  const done = () => { if (finished) return; finished = true; state = listening ? "idle" : "off"; setStatus(listening ? 'Diga "Veli" para chamar' : "Toque no microfone para ativar", listening); resumeListening(); };
  if (!settings.voice || !text){ done(); return; }
  if (settings.natural && audioCtx){
    try{
      state = "thinking"; setStatus("Preparando a voz...", true);
      const buf = await naturalAudio(clean(text), settings.natural);
      state = "speaking"; setStatus("Falando... toque na esfera para interromper", true);
      await playBuffer(buf);
      done(); return;
    }catch(e){ /* sem voz natural agora: usa a voz do navegador */ }
  }
  browserSpeak(text, done);
}

/* ---------- escuta (palavra "Veli") ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const WAKE = /\b(v[eéê]l+[iíy]e?|v[eéê]l+h?[iíy]|vel+e|vel[eé]|vell|v[eé]ly|b[eé]l+[iíy]|belly|bel+e|n[eé]l+[iíy]|valley|v[eéê]\s+l[iíy]|vê\s+li)\b[,.!?:]?/i;
const WAKE_START = /^\s*(velh[oa]s?|v[eé]i|v[oóô]lei|volley|voley|vôlei)\b[,.!?:]?/i;
function findWake(txt){ return txt.match(WAKE) || txt.match(WAKE_START); }
let interimTimer = null, lastHandled = "", lastHandledAt = 0;
let rec = null, listening = false, paused = false, mode = "wake", cmdTimer = null, wakeLock = null;

function startRec(){
  if (!SR || !listening || paused) return;
  try{
    rec = new SR(); rec.lang = "pt-BR"; rec.continuous = true; rec.interimResults = true;
    rec.onresult = ev => {
      for (let i = ev.resultIndex; i < ev.results.length; i++){
        const r = ev.results[i], txt = r[0].transcript.trim();
        if (txt) $("heard").textContent = "Ouvi: " + txt;
        clearTimeout(interimTimer);
        if (!r.isFinal){
          if (mode === "command" || findWake(txt)){
            if (mode === "wake"){ state = "listening"; setStatus("Estou ouvindo...", true); }
            interimTimer = setTimeout(() => { handleFinal(txt); try{ rec && rec.abort(); }catch(e){} }, 1600);
          }
          continue;
        }
        handleFinal(txt);
      }
    };
    rec.onerror = ev => {
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed" || ev.error === "audio-capture"){
        stopListening();
        setStatus("O microfone não foi liberado. Permita o microfone ou escreva abaixo.");
      }
    };
    rec.onend = () => { rec = null; if (listening && !paused) setTimeout(startRec, 250); };
    rec.start();
  }catch(e){ setTimeout(startRec, 800); }
}
function handleFinal(txt){
  if (busy) return;
  const now = Date.now();
  if (txt === lastHandled && now - lastHandledAt < 4000) return;
  lastHandled = txt; lastHandledAt = now;
  if (mode === "command"){ clearTimeout(cmdTimer); mode = "wake"; ask(txt.replace(WAKE, "").replace(WAKE_START, "").trim() || txt); return; }
  const m = findWake(txt);
  if (!m) return;
  const after = txt.slice(m.index + m[0].length).replace(/^[\s,.!?:]+/, "").trim();
  if (after.length > 2){ ask(after); return; }
  mode = "command"; state = "listening"; setStatus("Pode falar, estou ouvindo", true);
  clearTimeout(cmdTimer);
  cmdTimer = setTimeout(() => { mode = "wake"; if (!busy){ state = "idle"; setStatus('Diga "Veli" para chamar', true); } }, 9000);
}
function pauseListening(){ paused = true; try{ rec && rec.abort(); }catch(e){} }
function resumeListening(){ paused = false; mode = "wake"; if (listening && !rec) setTimeout(startRec, 300); }
async function startListening(){
  if (!SR){ setStatus("Este navegador não reconhece voz. Use o Chrome ou escreva abaixo."); return; }
  listening = true; paused = false; mode = "wake";
  micBtn.classList.add("on"); micBtn.setAttribute("aria-label", "Desativar escuta");
  state = "idle"; setStatus('Diga "Veli" para chamar', true);
  try{ if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
  startRec();
}
function stopListening(){
  listening = false; clearTimeout(cmdTimer);
  try{ rec && rec.abort(); }catch(e){} rec = null;
  micBtn.classList.remove("on"); micBtn.setAttribute("aria-label", "Ativar escuta");
  if (!busy && state !== "speaking"){ state = "off"; setStatus("Toque no microfone para ativar"); }
  try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null;
}
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && listening){
    try{ if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
    if (!rec && !paused) startRec();
  }
});

/* ---------- controles ---------- */
micBtn.addEventListener("click", () => listening ? stopListening() : startListening());
canvas.addEventListener("click", () => {
  if (state === "speaking"){ stopSpeaking(); return; }
  if (busy) return;
  if (!listening) startListening();
  else { mode = "command"; state = "listening"; setStatus("Pode falar, estou ouvindo", true);
    clearTimeout(cmdTimer); cmdTimer = setTimeout(() => { mode = "wake"; if (!busy){ state = "idle"; setStatus('Diga "Veli" para chamar', true); } }, 9000); }
});
function sendTyped(){ const v = input.value; input.value = ""; input.blur(); ask(v); }
$("send").addEventListener("click", sendTyped);
input.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); sendTyped(); } });

const sheet = $("sheet");
function openSettings(){ $("pw").value = settings.senha || ""; $("voiceOn").checked = settings.voice !== false; $("natSel").value = settings.natural || ""; $("rate").value = settings.rate || 1.03; $("pitch").value = settings.pitch || 1; fillVoices(); sheet.classList.add("open"); if (!settings.senha) $("pw").focus(); }
$("testNat").addEventListener("click", async () => {
  const voz = $("natSel").value; const btn = $("testNat");
  if (!voz){ setStatus("Escolha uma voz natural para ouvir"); return; }
  if (!settings.senha && !$("pw").value.trim()){ setStatus("Digite a senha primeiro"); return; }
  const senhaAntiga = settings.senha; settings.senha = settings.senha || $("pw").value.trim();
  btn.textContent = "Carregando...";
  try{ unlockAudio(); const buf = await naturalAudio("Olá, eu sou a VELI. É assim que eu vou falar com você.", voz); stopSpeaking(); await playBuffer(buf); }
  catch(e){ setStatus(String(e.message) === "limite" ? "Limite gratuito da voz natural atingido por hoje" : "A voz natural não respondeu. Confira se a planilha foi atualizada."); }
  settings.senha = senhaAntiga; btn.textContent = "Ouvir voz natural";
});
$("testVoice").addEventListener("click", () => {
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance("Olá, eu sou a VELI. É assim que eu vou falar com você.");
    const v = allVoices.find(x => x.name === $("voiceSel").value);
    u.lang = v ? v.lang : "pt-BR"; if (v) u.voice = v; u.rate = parseFloat($("rate").value); u.pitch = parseFloat($("pitch").value);
    speechSynthesis.speak(u);
  }catch(e){}
});
$("openSettings").addEventListener("click", openSettings);
$("closeSettings").addEventListener("click", () => sheet.classList.remove("open"));
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.classList.remove("open"); });
$("saveSettings").addEventListener("click", () => {
  settings = { senha: $("pw").value.trim(), voice: $("voiceOn").checked, voiceName: $("voiceSel").value, rate: parseFloat($("rate").value), pitch: parseFloat($("pitch").value), natural: $("natSel").value }; save("veli-settings", settings);
  voice = allVoices.find(v => v.name === settings.voiceName) || voice;
  sheet.classList.remove("open"); setStatus("Ajustes salvos", listening);
});
$("clearHistory").addEventListener("click", () => { history = []; save("veli-history", history); talkEl.innerHTML = ""; sheet.classList.remove("open"); setStatus("Tela limpa", listening); });
if (!settings.senha) setTimeout(openSettings, 600);
})();
</script>
